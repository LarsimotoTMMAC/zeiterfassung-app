  @media (max-width: 900px) {

  /* ── Sync-Status & Login ── */
  .sync-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:14px; font-size:0.74rem; font-weight:700; background:rgba(255,255,255,0.12); color:#a8c4e0; cursor:default; white-space:nowrap; }
  .sync-chip .dot { width:9px; height:9px; border-radius:50%; background:#888; flex:none; }
  .sync-chip.ok .dot { background:#3ddc84; }

  .dc-row .dc-val.pe { color: #a85400; }

  .aus-card .dc-row.a1 { grid-template-columns: 92px 1fr; margin-top: 0; }
  .aus-card .dc-row.a2 { grid-template-columns: 1fr 1fr 1fr 44px; align-items: end; }
  .aus-card .dc-row input { text-align: left; }
  .aus-card .btn.red { padding: 8px 0; width: 100%; }

  /* ── Mobile ── */
  @media (max-width: 760px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 0.98rem; }

    .month-tabs { padding: 0; position: sticky; top: 0; z-index: 60; }

    .sub-tabs::-webkit-scrollbar { display: none; }
    .sub-tabs button { padding: 12px 11px; font-size: 0.8rem; white-space: nowrap; flex: none; }
    .container { padding: 12px 8px 90px; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -8px; padding: 0 8px; }
    .table-scroll table.grid { min-width: 720px; }
    .table-scroll table.grid.xwide { min-width: 1080px; }
    /* 16px verhindert Auto-Zoom beim Fokussieren auf iOS */
    input, select, textarea { font-size: 16px; }
    .dc-row input, .dc-row select { padding: 9px 2px; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .kpi { padding: 10px 12px; }
    .kpi .v { font-size: 1.02rem; }
    .panel { padding: 14px 12px; }
    .login-wrap { margin: 24px 10px; }
    .toolbar .btn { flex: 1 1 auto; text-align: center; }
    .hotel-edit, .he-head { grid-template-columns: 1fr; }
    .hint { font-size: 0.74rem; }
    .calc td { padding: 8px 6px; font-size: 0.84rem; }
    .calc input.num { width: 110px; }
  }
</style>

<header>
  <div>
    <h1>Zeiterfassung &amp; Reiseplan – Juni / Juli / August 2026</h1>
    <p id="headerSub">Daten werden verschlüsselt von GitHub geladen</p>
  </div>
  <div style="display:flex;align-items:center;gap:14px;">
    <span class="sync-chip local" id="syncChip" title="Synchronisierungs-Status"><span class="dot"></span><span id="syncChipText">–</span></span>

</header>

<div class="month-tabs" id="monthTabs"></div>

<div class="container" id="main"></div>

<script>
'use strict';

/* ════════════════════════ KONFIG ════════════════════════ */
const STORAGE_KEY = 'followred_zeiterfassung_sommer2026_v1';
const STUNDENLOHN_DEFAULT = 20.00;

const DEFAULT_RATES = [
  { code:'DE',  label:'Deutschland Volltag',    flag:'🇩🇪', rate:28.00, fruehAbzug:true },
  { code:'DEA', label:'Deutschland An-/Abreise',flag:'🇩🇪', rate:14.00, fruehAbzug:false },
  { code:'PL',  label:'Polen',                  flag:'🇵🇱', rate:29.00, fruehAbzug:true },
  { code:'SK',  label:'Slowakei',               flag:'🇸🇰', rate:33.00, fruehAbzug:true },
  { code:'HU',  label:'Ungarn',                 flag:'🇭🇺', rate:32.00, fruehAbzug:true },
  { code:'RO',  label:'Rumänien',               flag:'🇷🇴', rate:27.00, fruehAbzug:true },
  { code:'ROB', label:'Rumänien (Bukarest)',    flag:'🇷🇴', rate:32.00, fruehAbzug:true },
  { code:'BG',  label:'Bulgarien',              flag:'🇧🇬', rate:22.00, fruehAbzug:true },
  { code:'IT',  label:'Italien',                flag:'🇮🇹', rate:42.00, fruehAbzug:true },
  { code:'FR',  label:'Frankreich',             flag:'🇫🇷', rate:53.00, fruehAbzug:true },
  { code:'CH',  label:'Schweiz',                flag:'🇨🇭', rate:64.00, fruehAbzug:true },
  { code:'AT',  label:'Österreich',             flag:'🇦🇹', rate:50.00, fruehAbzug:true },
  { code:'SI',  label:'Slowenien',              flag:'🇸🇮', rate:38.00, fruehAbzug:true },
  { code:'CZ',  label:'Tschechien',             flag:'🇨🇿', rate:32.00, fruehAbzug:true },
  { code:'SE',  label:'Schweden (BMF – bitte prüfen)',  flag:'🇸🇪', rate:50.00, fruehAbzug:true },
  { code:'FI',  label:'Finnland (BMF – bitte prüfen)',  flag:'🇫🇮', rate:50.00, fruehAbzug:true }
];

const SV = [
  { key:'kv', label:'KV-Beitrag (AN-Anteil 8,79 %)', satz:0.0879 },
  { key:'rv', label:'RV-Beitrag (9,30 %)', satz:0.0930 },
  { key:'av', label:'AV-Beitrag (1,30 %)', satz:0.0130 },
  { key:'pv', label:'PV-Beitrag kinderlos (2,40 %)', satz:0.0240 }
];

/* Stammdaten (Name, IBAN, Steuer-ID, …) liegen NICHT im Code –
   sie kommen mit dem Daten-State aus dem privaten GitHub-Repo (state.stamm). */
function getStamm() {
  return state && state.stamm ? state.stamm : { name:'', adresse:'', pnr:'', geb:'', stkl:'', eintritt:'', steuerId:'', svNr:'', kk:'', bank:'', iban:'' };
}

const MONTHS = [
  { id:'juni',   name:'Juni',   num:6, year:2026, tage:30, uebertragInDefault:null, vorschussDefault:0 },
  { id:'juli',   name:'Juli',   num:7, year:2026, tage:31, uebertragInDefault:null, vorschussDefault:0 },
  { id:'august', name:'August', num:8, year:2026, tage:31, uebertragInDefault:null, vorschussDefault:0 },
  { id:'september', name:'September', num:9, year:2026, tage:30, uebertragInDefault:null, vorschussDefault:0 }
];

const WOCHENTAGE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WD_KURZ = ['So','Mo','Di','Mi','Do','Fr','Sa'];

/* ════════════════════════ DEFAULT STATE (leer – echte Daten kommen aus GitHub) ════════════════════════ */
function defaultState() {
  const months = {};
  MONTHS.forEach(m => {
    const days = [];
    for (let t = 1; t <= m.tage; t++) {
      days.push({ tag:t, typ:'frei', taetigkeit:'', land:'DE', frueh:'ohne', start:'', ende:'', pause:'', status:'geplant', spesenOverride:'' });
    }
    months[m.id] = {
      days,
      auslagen: [],
      lenkzeiten: [],
      reiseplan: { hotels: [] },
      abrechnung: {
        uebertragIn: m.uebertragInDefault,   // null = automatisch vom Vormonat
        vorschuss: m.vorschussDefault,
        stundenAbrechnen: null,              // null = alle bestätigten
        bruttoAuszahlung: 3000.00,
        lst: 34.00,
        notiz: ''
      }
    };
  });
  return { stundenlohn: STUNDENLOHN_DEFAULT, rates: JSON.parse(JSON.stringify(DEFAULT_RATES)), months, stamm: null };
}

/* ════════════════════════ STATE + GITHUB-SYNC ════════════════════════ */
const DATA_OWNER = 'LarsimotoTMMAC';
const DATA_REPO  = 'zeiterfassung-daten';
const DATA_PATH  = 'state.json';
const SYNC_KEY   = 'followred_sync_config_v1';
const GH_API     = 'https://api.github.com';

let syncCfg = null;
try { syncCfg = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); } catch(e) {}

let state = null;
let fileSha = null;      // aktueller Git-Blob-SHA von state.json (nötig für Commits)
let dirty = false;       // es gibt Änderungen, die noch nicht auf GitHub sind
let pushTimer = null;
let pushing = false;

let curMonth = 'juni';
let curSub = 'zeit';

function setChip(mode, text) {
  const chip = document.getElementById('syncChip');
  if (!chip) return;
  chip.className = 'sync-chip ' + mode;
  document.getElementById('syncChipText').textContent = text;
}
function cacheLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }

function b64EncodeUtf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64DecodeUtf8(b64) {
  const bin = atob(String(b64).replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function ghUrl() { return GH_API + '/repos/' + syncCfg.owner + '/' + syncCfg.repo + '/contents/' + syncCfg.path; }
function ghHeaders() {
  return { 'Authorization': 'Bearer ' + syncCfg.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
}

function showLogin(err) {
  document.getElementById('monthTabs').innerHTML = '';
  document.getElementById('subTabs').innerHTML = '';
  setChip('local', 'nicht verbunden');
  document.getElementById('main').innerHTML = `
    <div class="login-wrap">
      <h2>🔐 Entsperren</h2>
      <p>Alle Daten liegen in einem <b>privaten</b> GitHub-Repo. Zum Entsperren einmalig den Zugriffs-Token eingeben – er wird nur auf diesem Gerät gespeichert (Anleitung liegt im Daten-Repo).</p>
      <label>GitHub-Token</label>
      <input type="password" id="loginToken" placeholder="github_pat_…" autocomplete="off"
             onkeydown="if(event.key==='Enter')doLogin()">
      <div class="login-err" id="loginErr"></div>
      <div style="margin-top:18px;"><button class="btn green" style="width:100%;padding:12px;" onclick="doLogin()">Entsperren &amp; Daten laden</button></div>
    </div>`;
  if (err) { const e = document.getElementById('loginErr'); e.style.display = 'block'; e.textContent = err; }
}
function doLogin() {
  const t = document.getElementById('loginToken').value.trim();
  if (!t) return;
  syncCfg = { owner: DATA_OWNER, repo: DATA_REPO, path: DATA_PATH, token: t };
  localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg));
  loadRemote();
}
function logout() {
  if (!confirm('Token von diesem Gerät entfernen? (Daten auf GitHub bleiben erhalten)')) return;
  localStorage.removeItem(SYNC_KEY);
  syncCfg = null;
  showLogin();
}

function migrateLz() {
  if (!state || !state.months) return;
  MONTHS.forEach(mo => {
    if (state.months[mo.id] && !Array.isArray(state.months[mo.id].lenkzeiten)) {
      state.months[mo.id].lenkzeiten = [];
    }
  });
}

function afterLoad() {
  migrateLz();
  const st = getStamm();
  const sub = document.getElementById('headerSub');
  if (sub) sub.textContent = (st.name ? st.name + ' · ' : '') + 'Foodtruck Bosch ProTour · Stundenlohn ' + dec(state.stundenlohn) + ' €/Std · Sync via GitHub';
  render();
}

async function loadRemote() {
  setChip('pending', 'lädt…');
  try {
    const res = await fetch(ghUrl(), { headers: ghHeaders(), cache: 'no-store' });
    if (res.status === 401 || res.status === 403) { showLogin('Token ungültig, abgelaufen oder ohne Zugriff auf das Daten-Repo.'); return; }
    if (res.status === 404) { showLogin('state.json im Repo ' + syncCfg.owner + '/' + syncCfg.repo + ' nicht gefunden – Token-Berechtigung prüfen.'); return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    fileSha = j.sha;
    state = JSON.parse(b64DecodeUtf8(j.content));
    if (!state.months) throw new Error('state.json hat unerwartetes Format');
    cacheLocal();
    dirty = false;
    setChip('ok', 'synchron');
    afterLoad();
  } catch(e) {
    // Offline o. Ä. → mit lokaler Kopie weiterarbeiten, falls vorhanden
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch(_) {}
    if (raw) {
      try { state = JSON.parse(raw); } catch(_) { state = null; }
    }
    if (state) { setChip('error', 'offline – lokale Kopie'); afterLoad(); }
    else showLogin('Keine Verbindung zu GitHub und keine lokale Kopie vorhanden (' + e.message + ').');
  }
}

async function pushRemote() {
  if (!state || !syncCfg) return;
  if (pushing) { clearTimeout(pushTimer); pushTimer = setTimeout(pushRemote, 1500); return; }
  pushing = true;
  setChip('pending', 'speichert…');
  try {
    state._meta = Object.assign({}, state._meta, { updated: new Date().toISOString() });
    const body = { message: 'Zeiterfassung: Stand ' + new Date().toLocaleString('de-DE'), content: b64EncodeUtf8(JSON.stringify(state, null, 2)) };
    if (fileSha) body.sha = fileSha;
    let res = await fetch(ghUrl(), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) });
    if (res.status === 409 || res.status === 422) {
      // SHA veraltet (z. B. zwischenzeitlich von anderem Gerät gespeichert) → aktuellen SHA holen, einmal erneut
      const cur = await fetch(ghUrl(), { headers: ghHeaders(), cache: 'no-store' });
      if (cur.ok) {
        body.sha = (await cur.json()).sha;
        res = await fetch(ghUrl(), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) });
      }
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    fileSha = j.content.sha;
    dirty = false;
    setChip('ok', 'synchron');
  } catch(e) {
    setChip('error', 'NICHT gespeichert');
  } finally {
    pushing = false;
  }
}

function save() {
  if (!state) return;
  cacheLocal();
  dirty = true;
  setChip('pending', 'speichert…');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushRemote, 1500);
}

/* ════════════════════════ HELPER ════════════════════════ */
function pMin(t) { // "HH:MM" -> Minuten, null bei leer/ungültig
  if (!t) return null;
  const m = String(t).trim().match(/^(\d{1,2})[:.](\d{2})$/);
  if (!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function fMin(min) { // Minuten -> "H:MM" / "HH:MM"
  if (min == null) return '–';
  min = ((min % 1440) + 1440) % 1440;
  const h = Math.floor(min/60), mm = min%60;
  return String(h).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}
function fDur(min) {
  if (min == null) return '–';
  const h = Math.floor(min/60), mm = min%60;
  return String(h).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}
function eur(x) { return x.toLocaleString('de-DE',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' €'; }
function dec(x) { return x.toLocaleString('de-DE',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function monthMeta(id) { return MONTHS.find(m=>m.id===id); }
function rateFor(code) { return state.rates.find(r=>r.code===code); }

function dayCalc(day) {
  // Rückgabe: { minNetto, dezStd, endeMitPause, spesen }
  let minNetto = null, endeMitPause = null;
  if (day.typ === 'offday') {
    minNetto = 360;
  } else if (day.typ === 'frei') {
    minNetto = 0;
  } else {
    const s = pMin(day.start), e = pMin(day.ende);
    if (s != null && e != null) {
      let diff = e - s; if (diff <= 0) diff += 1440; // über Mitternacht
      minNetto = diff;
      const p = pMin(day.pause);
      if (p != null && p > 0) endeMitPause = e + p;
      else endeMitPause = e;
    }
  }
  let spesen = 0;
  if (day.typ !== 'frei') {
    if (day.spesenOverride !== '' && day.spesenOverride != null && !isNaN(parseFloat(day.spesenOverride))) {
      spesen = parseFloat(day.spesenOverride);
    } else {
      const r = rateFor(day.land);
      if (r) spesen = (day.frueh === 'mit' && r.fruehAbzug) ? Math.round(r.rate*0.8*100)/100 : r.rate;
    }
  }
  return { minNetto, dezStd: minNetto==null?null:minNetto/60, endeMitPause, spesen };
}

function monthSums(mid) {
  const m = state.months[mid];
  let minB=0, minG=0, spB=0, spG=0, tageB=0, tageG=0;
  m.days.forEach(d => {
    if (d.typ==='frei') return;
    const c = dayCalc(d);
    const mins = c.minNetto||0;
    if (d.status==='bestaetigt') { minB+=mins; spB+=c.spesen; tageB++; }
    else { minG+=mins; spG+=c.spesen; tageG++; }
  });
  const auslagen = m.auslagen.reduce((a,x)=>a+(parseFloat(x.betrag)||0),0);
  return { minB, minG, spB, spG, tageB, tageG, auslagen };
}

function uebertragInEffective(mid) {
  const m = state.months[mid];
  if (m.abrechnung.uebertragIn != null) return m.abrechnung.uebertragIn;
  // automatisch: Übertrag-out des Vormonats
  const idx = MONTHS.findIndex(x=>x.id===mid);
  if (idx <= 0) return 0;
  return abrechnungCalc(MONTHS[idx-1].id).uebertragOut;
}

function abrechnungCalc(mid) {
  const m = state.months[mid];
  const a = m.abrechnung;
  const sums = monthSums(mid);
  const stdBest = sums.minB/60;
  const stdAbr = (a.stundenAbrechnen != null && a.stundenAbrechnen !== '') ? parseFloat(a.stundenAbrechnen) : stdBest;
  const brutto = Math.round(stdAbr * state.stundenlohn * 100)/100;
  const uebIn = uebertragInEffective(mid);
  const pool = Math.round((brutto + uebIn)*100)/100;
  const auszBrutto = Math.min(parseFloat(a.bruttoAuszahlung)||0, pool);
  const svAbz = SV.map(s=>({ ...s, betrag: Math.round(auszBrutto*s.satz*100)/100 }));
  const lst = parseFloat(a.lst)||0;
  const abzuege = svAbz.reduce((x,s)=>x+s.betrag, lst);
  const netto = Math.round((auszBrutto - abzuege)*100)/100;
  const vorschuss = parseFloat(a.vorschuss)||0;
  const nettoNachV = Math.round((netto - vorschuss)*100)/100;
  const auszahlung = Math.round((nettoNachV + sums.spB + sums.auslagen)*100)/100;
  const uebertragOut = Math.round((pool - auszBrutto)*100)/100;
  const restStd = Math.max(0, stdBest - stdAbr);
  return { sums, stdBest, stdAbr, brutto, uebIn, pool, auszBrutto, svAbz, lst, abzuege, netto, vorschuss, nettoNachV, auszahlung, uebertragOut, restStd };
}

function updDay(i, key, val) {
  const d = state.months[curMonth].days[i];
  d[key] = val;
  if (key==='typ') {
    if (val==='offday'||val==='frei') { d.start=''; d.ende=''; d.pause=''; }
    else if (!d.pause) d.pause='0:45';
  }
  save(); render();
}
function alleBestaetigen() {
  state.months[curMonth].days.forEach(d => {
    if (d.typ==='frei') return;
    const hasTimes = pMin(d.start)!=null && pMin(d.ende)!=null;
    if (d.typ==='offday' || hasTimes) d.status='bestaetigt';
  });
  save(); render();
}
function spesenOverrideAt(idx) {
  const d = state.months[curMonth].days[idx];
  const cur = d.spesenOverride;
  const val = prompt('Spesen-Override für diesen Tag (leer = automatisch):', cur==null?'':cur);
  if (val === null) return;
  d.spesenOverride = val.trim()==='' ? '' : val.replace(',','.');
  save(); render();
}
function spesenOverridePrompt(ev) {
  const cell = ev.target.closest('td');
  if (!cell || !cell.classList.contains('spesen-val')) return;
  const tr = cell.closest('tr');
  spesenOverrideAt(Array.from(tr.parentNode.children).indexOf(tr));
}

          <label>Datum<input value="${esc(a.datum)}" placeholder="TT.MM." onchange="updAusl(${i},'datum',this.value)"></label>
          <label>Beschreibung<input value="${esc(a.beschreibung)}" placeholder="z. B. Waschstraße" onchange="updAusl(${i},'beschreibung',this.value)"></label>

          <label>Ort<input value="${esc(a.ort)}" onchange="updAusl(${i},'ort',this.value)"></label>
          <label>Zahlung<select onchange="updAusl(${i},'zahlung',this.value)">
            <option value="Bar" ${a.zahlung==='Bar'?'selected':''}>Bar</option>
            <option value="Karte" ${a.zahlung==='Karte'?'selected':''}>Karte</option>
          </select></label>
          <label>Betrag €<input inputmode="decimal" value="${esc(a.betrag)}" placeholder="0,00" onchange="updAusl(${i},'betrag',this.value.replace(',','.'))"></label>

    return `
    <div class="hint blue">Auslagen (Waschstraße, Maut bar, Tickets, …) – werden netto erstattet. Belege aufbewahren!</div>

    <button class="btn green" style="width:100%;padding:12px;" onclick="addAusl()">+ Auslage hinzufügen</button>`;
  }

  let rows = m.auslagen.map((a,i)=>`
    <tr>
      <td><input class="t" style="width:80px" value="${esc(a.datum)}" placeholder="TT.MM." onchange="updAusl(${i},'datum',this.value)"></td>

      <td><button class="btn small red" onclick="delAusl(${i})">✕</button></td>
    </tr>`).join('');
  const sum = m.auslagen.reduce((x,a)=>x+(parseFloat(a.betrag)||0),0);
  return `
  <div class="hint blue">Auslagen (Waschstraße, Maut bar, Tickets, …) – werden netto erstattet. Belege aufbewahren!</div>
  <div class="table-scroll">
  <table class="grid">
    <thead><tr><th>Datum</th><th>Beschreibung</th><th>Ort</th><th style="width:90px">Zahlung</th><th style="width:110px">Betrag (€)</th><th style="width:50px"></th></tr></thead>

  </table>
  </div>
  <div style="margin-top:12px;"><button class="btn green" onclick="addAusl()">+ Auslage hinzufügen</button></div>`;
}
function updAusl(i,k,v){ state.months[curMonth].auslagen[i][k]=v; save(); if(k==='betrag') render(); }
function addAusl(){ state.months[curMonth].auslagen.push({datum:'',beschreibung:'',ort:'',zahlung:'Bar',betrag:''}); save(); render(); }
function delAusl(i){ state.months[curMonth].auslagen.splice(i,1); save(); render(); }

/* ════════════════════════ RENDER: ABRECHNUNG ════════════════════════ */
function renderAbrechnung() {
  const meta = monthMeta(curMonth);
  const m = state.months[curMonth];
  const a = m.abrechnung;
  const c = abrechnungCalc(curMonth);
  const idx = MONTHS.findIndex(x=>x.id===curMonth);
  const prevName = idx>0 ? MONTHS[idx-1].name : 'Mai';
  const nextName = idx<MONTHS.length-1 ? MONTHS[idx+1].name : 'Oktober';
  const autoUeb = a.uebertragIn == null;

  return `
  <div class="hint">${meta.id==='juni'
    ? '<b>Übertrag aus Mai:</b> Restbrutto und Vorschuss sind aus der Mai-Abrechnung vorbefüllt (siehe Eingabefelder) – der Vorschuss wird in dieser Abrechnung abgezogen.'
    : `<b>Übertrag aus ${prevName}:</b> wird automatisch aus der ${prevName}-Abrechnung übernommen (Feld leer lassen) oder manuell überschreiben.`}</div>

  <div class="panel">
    <h3>Eingaben – hier legst du fest</h3>
    <table class="calc">
      <tr><td>Bestätigte Stunden ${meta.name} (aus Zeiterfassung)</td><td>${dec(c.stdBest)} Std</td></tr>
      <tr><td>Davon <b>abrechnen</b> (Dezimalstunden – leer = alle)
        <br><span style="font-size:0.76rem;color:#888;">Hier legst du fest, wie viele Stunden in die ${meta.name}-Abrechnung fließen. Rest wandert als offene Stunden in den ${nextName}.</span></td>
        <td><input class="num" value="${a.stundenAbrechnen==null?'':esc(a.stundenAbrechnen)}" placeholder="${dec(c.stdBest)}" onchange="updAbr('stundenAbrechnen',this.value)"></td></tr>
      <tr><td>Brutto-Übertrag aus ${prevName} (€) ${autoUeb?'<span class="badge b-best">auto</span>':''}</td>
        <td><input class="num" value="${a.uebertragIn==null?'':esc(a.uebertragIn)}" placeholder="${dec(c.uebIn)} (auto)" onchange="updAbr('uebertragIn',this.value)"></td></tr>
      <tr><td>Brutto-<b>Auszahlung</b> diese Abrechnung (€)</td>
        <td><input class="num" value="${esc(a.bruttoAuszahlung)}" onchange="updAbr('bruttoAuszahlung',this.value)"></td></tr>
      <tr><td>Lohnsteuer StKl 3 (ca., €) <span style="font-size:0.76rem;color:#888;">– bei 3.000 € Brutto ≈ 34 €</span></td>
        <td><input class="num" value="${esc(a.lst)}" onchange="updAbr('lst',this.value)"></td></tr>
      <tr><td>Vorschuss-Abzug (€)</td>
        <td><input class="num" value="${esc(a.vorschuss)}" onchange="updAbr('vorschuss',this.value)"></td></tr>
    </table>
  </div>

  <div class="panel">
    <h3>Brutto-Pool ${meta.name} 2026</h3>
    <table class="calc">
      <tr><td>Stundenlohn ${meta.name}: ${dec(c.stdAbr)} Std × ${dec(state.stundenlohn)} €</td><td>${eur(c.brutto)}</td></tr>
      <tr class="gold"><td>+ Restbrutto-Übertrag ${prevName}</td><td>+ ${eur(c.uebIn)}</td></tr>
      <tr class="sum"><td>= Brutto-Pool gesamt</td><td>${eur(c.pool)}</td></tr>
      <tr class="red"><td>./. Ausgezahltes Brutto (diese Abrechnung)</td><td>− ${eur(c.auszBrutto)}</td></tr>
      <tr class="gold"><td>= Restbrutto <b>Übertrag → ${nextName} 2026</b></td><td>${eur(c.uebertragOut)}</td></tr>
      ${c.restStd>0?`<tr class="gold"><td>+ Nicht abgerechnete Stunden → ${nextName}</td><td>${dec(c.restStd)} Std</td></tr>`:''}
    </table>
  </div>

  <div class="panel">
    <h3>Steuer / SV – auf ${eur(c.auszBrutto)} Brutto</h3>
    <table class="calc">
      <tr class="red"><td>Lohnsteuer (StKl 3, ca.)</td><td>− ${eur(c.lst)}</td></tr>
      ${c.svAbz.map(s=>`<tr class="red"><td>${s.label}</td><td>− ${eur(s.betrag)}</td></tr>`).join('')}
      <tr class="sum"><td>Gesamt Abzüge</td><td>− ${eur(c.abzuege)}</td></tr>
      <tr class="green"><td><b>Netto-Verdienst</b></td><td>${eur(c.netto)}</td></tr>
    </table>
  </div>

  <div class="panel">
    <h3>Auszahlung</h3>
    <table class="calc">
      <tr><td>Netto-Verdienst</td><td>${eur(c.netto)}</td></tr>
      <tr class="red"><td>./. Vorschuss</td><td>− ${eur(c.vorschuss)}</td></tr>
      <tr><td>= Netto nach Vorschuss</td><td>${eur(c.nettoNachV)}</td></tr>
      <tr class="green"><td>+ Verpflegungsmehraufwand (Spesen, steuerfrei – nur bestätigte Tage)</td><td>+ ${eur(c.sums.spB)}</td></tr>
      <tr class="green"><td>+ Auslagenersatz (netto)</td><td>+ ${eur(c.sums.auslagen)}</td></tr>
      <tr class="total"><td>Auszahlungsbetrag gesamt</td><td>${eur(c.auszahlung)}</td></tr>
    </table>
  </div>
  ${c.sums.tageG>0?`<div class="hint">⚠️ ${c.sums.tageG} Tag(e) stehen noch auf „geplant" – deren Stunden (${fDur(c.sums.minG)}) und Spesen (${eur(c.sums.spG)}) sind NICHT in dieser Abrechnung. Vor Monatsabschluss bestätigen!</div>`:''}`;
}
function updAbr(k,v){
  const a = state.months[curMonth].abrechnung;
  if (v==null || String(v).trim()==='') a[k] = (k==='uebertragIn'||k==='stundenAbrechnen') ? null : 0;
  else a[k] = parseFloat(String(v).replace(',','.'));
  save(); render();
}

function download(filename, content) {
  const blob = new Blob([content], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function exportJSON() {
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Zeiterfassung_Sommer2026_Backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(input) {
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try { state = JSON.parse(r.result); save(); render(); alert('Backup eingespielt.'); } catch(e){ alert('Ungültige Datei.'); } };
  r.readAsText(f);
}
function reloadFromCloud() {
  if (dirty && !confirm('Es gibt noch nicht gespeicherte Änderungen – wirklich den Stand von GitHub neu laden und lokale Änderungen verwerfen?')) return;
  clearTimeout(pushTimer); dirty = false;
  loadRemote();
}

function exportReiseplanDoc(mid) {
  const meta = monthMeta(mid);
  const m = state.months[mid];
  const typLabel = {einsatz:['EINSATZ','#27ae60','#eafaf1'], reise:['REISETAG','#2980b9','#eaf3fb'], offday:['OFFDAY','#f1c40f','#fdfde7'], frei:['FREI','#bdc3c7','#f8f8f8']};

  m.days.forEach(d => {
    const date = new Date(meta.year, meta.num-1, d.tag);

    planRows += `<tr style="background:${bg};border-left:4px solid ${col};">

      <td>${esc(d.taetigkeit)}</td></tr>`;

/* ════════════════════════ RENDER: LENKZEITEN (EU VO (EG) 561/2006) ════════════════════════ */
const LZ = {
  DAY_NORMAL: 540,   // 9:00 h
  DAY_MAX:    600,   // 10:00 h (max 2×/Woche)
  BREAK_AFTER:270,   // 4:30 h Lenkzeit → Pause fällig
  BREAK_MIN:   45,   // 45 min Pflichtpause
  WEEK_MAX:  3360,   // 56:00 h / Woche
  BIWEEK_MAX:5400,   // 90:00 h / 2 Wochen
  REST_REG:   660,   // 11:00 h reguläre Tagesruhe
  REST_RED:   540,   // 9:00 h reduzierte Tagesruhe (min.)
  WK_REST_MIN:1440,  // 24:00 h – kürzeste (reduzierte) Wochenruhe
  WK_REST_REG:2700,  // 45:00 h – reguläre Wochenruhe
  SIX_DAY:    8640   // 6 × 24 h – spätester Beginn der Wochenruhe (Art. 8 Abs. 6)
};

// Ausnahme-Tatbestände, die der Fahrer pro Eintrag anklicken kann
const AUSN = [
  { v:'art12_1', l:'Art. 12 ¶1 – Weiterfahrt zum sicheren Halteplatz (Schutz Fahrzeug/Ladung/Person)' },
  { v:'art12_2', l:'Art. 12 ¶2 – +1 h Heimfahrt/Betriebssitz für die Wochenruhe' },
  { v:'art12_3', l:'Art. 12 ¶3 – +2 h zur regulären Wochenruhe (30-min-Pause unmittelbar vorher)' },
  { v:'ruhe_red_tag',   l:'Reduzierte Tagesruhe 9 h bewusst genutzt (Art. 8 Abs. 4, max. 3×/Woche)' },
  { v:'ruhe_red_woche', l:'Reduzierte Wochenruhe 24 h genutzt (Ausgleichspflicht, Art. 8 Abs. 6)' },
  { v:'sonstige', l:'Sonstige / höhere Gewalt' }
];
function ausnLabel(v){ const a = AUSN.find(x=>x.v===v); return a ? a.l : ''; }

// Welche Detail-/Ausnahme-Formulare gerade offen sind
let lzEdit = {};
function toggleLzEdit(i){ const k = curMonth+'#'+i; lzEdit[k] = !lzEdit[k]; render(); }

// Geltungsbereich: 'frei' = freiwillig/vertraglich (Werkverkehr/Foodtruck), 'auto' = nach Datum, 'bind' = gesetzlich
function lzGeltung(){ return state.lzGeltung || 'frei'; }
function setGeltung(v){ state.lzGeltung = v; save(); render(); }
function lzBindAt(it){
  const g = lzGeltung();
  if (g === 'bind') return true;
  if (g === 'frei') return false;
  return !!(it && it.startDt && it.startDt >= new Date(2026,6,1));   // auto: 561/2006 ab 01.07.2026
}

// Vorbefüllter Art.-12-Textbaustein für die Begründung
function fillAusnGrund(i){
  const e = lzArr()[i]; const c = lzCalc(e);
  const ov = pMin(e.ueberMin) || c.over || 0;
  const ovTxt = ov ? fDur(ov) + ' ' : '';
  e.ausnahmeGrund = 'Art. 12 VO 561/2006 – Überschreitung der Tageslenkzeit (10 h) um ' + ovTxt
    + 'wegen unvorhersehbarer Umstände auf der Route. Weiterfahrt zum gesicherten Halteplatz zur Sicherung von Fahrzeug und Roadshow-Equipment. '
    + 'Fahrtüchtigkeit gegeben, Verkehrssicherheit nicht gefährdet. Vermerk auf Tachograph-Ausdruck erfolgt.';
  e.ausnahme = true;
  save(); render();
}

function lzArr() {
  const m = state.months[curMonth];
  if (!Array.isArray(m.lenkzeiten)) m.lenkzeiten = [];
  return m.lenkzeiten;
}
function addLz()        { lzArr().push({ datum:'', start:'', ende:'', pause:'0:45', strecke:'' }); save(); render(); }
function updLz(i,k,v)   { lzArr()[i][k] = v; save(); render(); }
function delLz(i)       { if (confirm('Lenkzeit-Eintrag löschen?')) { lzArr().splice(i,1); save(); render(); } }

function lzCalc(e) {
  const s = pMin(e.start), en = pMin(e.ende);
  if (s == null || en == null) return { span:null, pause:pMin(e.pause)||0, drive:null, over:0, warns:[] };
  let span = en - s; if (span <= 0) span += 1440;   // über Mitternacht
  const pause = pMin(e.pause) || 0;
  const drive = Math.max(0, span - pause);
  const over  = Math.max(0, drive - LZ.DAY_MAX);    // Minuten über dem 10-h-Maximum
  const warns = [];
  if (drive > LZ.DAY_MAX)        warns.push(['err',  'Tageslenkzeit > 10:00 h – absolutes Maximum überschritten (Art. 6 Abs. 1)']);
  else if (drive > LZ.DAY_NORMAL) warns.push(['warn', 'Verlängerte Tageslenkzeit (> 9:00 h) – max. 2×/Woche zulässig (Art. 6 Abs. 1)']);
  if (drive > LZ.BREAK_AFTER && pause < LZ.BREAK_MIN) warns.push(['err', 'Lenkunterbrechung < 45 min bei > 4:30 h Lenkzeit (Art. 7)']);
  return { span, pause, drive, over, warns };
}

function weekMonday(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const k = (x.getDay() + 6) % 7;   // Mo=0 … So=6
  x.setDate(x.getDate() - k);
  return x;
}
function fDate(d) { return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.'; }

function lzAllEntries() {
  const list = [];
  MONTHS.forEach(mo => {
    const arr = (state.months[mo.id] && state.months[mo.id].lenkzeiten) || [];
    arr.forEach((e, idx) => {
      const day = parseInt(String(e.datum), 10);
      if (!day) return;
      const c = lzCalc(e);
      const sm = pMin(e.start);
      const startDt = sm != null
        ? new Date(mo.year, mo.num-1, day, Math.floor(sm/60), sm%60)
        : new Date(mo.year, mo.num-1, day);
      const endDt = c.span != null ? new Date(startDt.getTime() + c.span*60000) : null;
      list.push({ mo:mo.id, idx, e, c, day, num:mo.num, year:mo.year, startDt, endDt });
    });
  });
  list.sort((a,b) => a.startDt - b.startDt);
  return list;
}

function lzWeeks() {
  const all = lzAllEntries();
  for (let i = 0; i < all.length; i++) {
    all[i].restBefore = (i > 0 && all[i-1].endDt && all[i].startDt)
      ? Math.round((all[i].startDt - all[i-1].endDt) / 60000) : null;
  }
  const map = new Map();
  all.forEach(it => {
    const key = weekMonday(it.startDt).getTime();
    if (!map.has(key)) map.set(key, { monday: weekMonday(it.startDt), drive:0, days:0, tenH:0 });
    const w = map.get(key);
    if (it.c.drive != null) { w.drive += it.c.drive; if (it.c.drive > LZ.DAY_NORMAL) w.tenH++; }
    w.days++;
  });
  const arr = [...map.values()].sort((a,b) => a.monday - b.monday);
  for (let i = 0; i < arr.length; i++) arr[i].biweek = arr[i].drive + (i>0 ? arr[i-1].drive : 0);
  return { all, weeks: arr };
}

/* 6-Tage-Regel (Art. 8 Abs. 6): nach spätestens 6×24 h seit Ende der letzten Wochenruhe
   muss eine neue Wochenruhe beginnen. Eine Lücke ≥ 24 h zwischen zwei Fahrten = Wochenruhe. */
function lzBlocks(all) {
  const blocks = [];
  let cur = null;
  for (let i = 0; i < all.length; i++) {
    const it = all[i];
    const rest = it.restBefore;
    const weeklyRest = (i > 0 && rest != null && rest >= LZ.WK_REST_MIN);
    if (cur == null) {
      cur = { start: it.startDt, end: it.endDt || it.startDt, lastDay: 1, closedBy: null, anyViol: false };
      blocks.push(cur);
    } else if (weeklyRest) {
      cur.closedBy = rest;                 // bisheriger Block durch Wochenruhe geschlossen
      cur = { start: it.startDt, end: it.endDt || it.startDt, lastDay: 1, closedBy: null, anyViol: false };
      blocks.push(cur);
    }
    const elapsed = (it.startDt - cur.start) / 60000;   // Minuten seit Blockbeginn
    it.dayInBlock = Math.floor(elapsed / 1440) + 1;     // 24-h-Periode (1-basiert)
    it.sixViol = elapsed >= LZ.SIX_DAY;                 // beginnt nach 6×24 h ohne Wochenruhe
    if (it.sixViol) cur.anyViol = true;
    cur.lastDay = it.dayInBlock;
    cur.end = it.endDt || it.startDt;
  }
  return blocks;
}

function renderLenkzeiten() {
  const meta = monthMeta(curMonth);
  const arr  = lzArr();
  const { all, weeks } = lzWeeks();
  const blocks = lzBlocks(all);
  const g = lzGeltung();

  let monthDrive = 0;
  arr.forEach(e => { const c = lzCalc(e); if (c.drive != null) monthDrive += c.drive; });

  const tw = weeks.find(w => weekMonday(new Date()).getTime() === w.monday.getTime());

  // 6-Tage-KPI aus dem letzten (offenen) Block
  const openBlock = blocks.length ? blocks[blocks.length-1] : null;
  let sixKpi = '<div class="kpi"><div class="v">–</div><div class="l">6-Tage-Regel</div></div>';
  if (openBlock && openBlock.closedBy == null) {
    const used = openBlock.lastDay || 1;
    const remaining = 6 - used;
    const cls = openBlock.anyViol ? 'red' : (used >= 6 ? 'gold' : 'green');
    const txt = openBlock.anyViol ? 'Wochenruhe überfällig!'
      : (remaining <= 0 ? 'Wochenruhe jetzt fällig' : 'noch ' + remaining + ' Tag(e) bis Pflicht-Wochenruhe');
    const deadline = new Date(openBlock.start.getTime() + LZ.SIX_DAY*60000);
    sixKpi = `<div class="kpi ${cls}"><div class="v">Tag ${used}/6</div><div class="l">${txt}<br><span style="font-size:0.7rem;opacity:.85;">spät. Ruhebeginn: ${fDate(deadline)}</span></div></div>`;
  }

  const kpis = `<div class="kpi-row">
    <div class="kpi"><div class="v">${fDur(monthDrive)}</div><div class="l">Lenkzeit ${meta.name} gesamt</div></div>
    <div class="kpi ${tw && tw.drive > LZ.WEEK_MAX ? 'gold' : 'green'}"><div class="v">${tw ? fDur(tw.drive) : '00:00'}</div><div class="l">aktuelle Woche (max 56:00)</div></div>
    ${sixKpi}
    <div class="kpi"><div class="v">${arr.length}</div><div class="l">Fahrtage erfasst (${meta.name})</div></div>
  </div>`;

  // Geltungsbereich-Umschalter
  const gOpt = (v,l) => `<option value="${v}" ${g===v?'selected':''}>${l}</option>`;
  const gText = g==='frei'
      ? 'Foodtruck mit Kunden-Branding = eigenes Werbefahrzeug (<b>Werkverkehr</b>). Bei 2,5–3,5 t erfasst die Ausweitung ab 01.07.2026 nur <b>gewerbliche Güterbeförderung (hire/reward)</b> → 561/2006 greift hier <b>vermutlich nicht gesetzlich</b>. Prüfung als <b>Eigenübersicht / Vertragstreue</b>; das <b>ArbZG</b> (max. 10 h, 11 h Ruhe) gilt unabhängig. <i>Verbindliche Einstufung bei der Agentur einholen.</i>'
    : g==='auto'
      ? 'Vor dem 01.07.2026 außerhalb 561/2006, ab 01.07.2026 (grenzüberschr. gewerblich) gesetzlich bindend — pro Eintrag nach Datum.'
      : 'Alle Abweichungen werden als <b>gesetzliche Verstöße</b> (VO (EG) 561/2006) gewertet.';
  const gBanner = `<div class="hint ${g==='frei'?'blue':''}" style="${g==='bind'?'border-left-color:#c0392b;background:#fdecea;color:#7a0000;':''}">
    <label style="font-weight:700;">⚖ Geltungsbereich:
      <select onchange="setGeltung(this.value)">
        ${gOpt('frei','Freiwillig / vertraglich – Werkverkehr (Foodtruck) ≤ 3,5 t')}
        ${gOpt('auto','Automatisch nach Datum (561/2006 ab 01.07.2026)')}
        ${gOpt('bind','Gesetzlich bindend (561/2006)')}
      </select>
    </label>
    <div style="margin-top:6px;font-size:0.78rem;font-weight:400;">${gText}</div>
  </div>`;

  const rows = arr.map((e,i) => {
    const c = lzCalc(e);
    const it = all.find(x => x.mo === curMonth && x.idx === i);
    const bind = lzBindAt(it);
    // Status-Icon inkl. Ausnahme-Reklassifizierung
    let icon;
    if (!c.warns.length) icon = '<span style="color:#28a745;">✓</span>';
    else if (e.ausnahme) {
      icon = '<span title="Abweichung dokumentiert: '+esc(ausnLabel(e.ausnahmeArt)||'Ausnahme')+'" style="cursor:help;">🟡</span>';
      if (!e.vermerkAusdruck) icon += ' <span title="Pflicht-Vermerk auf Tachograph-Ausdruck fehlt!" style="cursor:help;">📝❗</span>';
    } else {
      icon = c.warns.map(w => `<span title="${esc(w[1])}" style="cursor:help;">${w[0]==='err'?(bind?'❌':'⚠️'):'⚠️'}</span>`).join(' ');
    }
    // 6-Tage-Block-Marker
    let blk = '–';
    if (it && it.dayInBlock) {
      blk = it.sixViol
        ? `<span title="über 6×24 h ohne Wochenruhe (Art. 8 Abs. 6)" style="color:#c0392b;font-weight:700;cursor:help;">${it.dayInBlock}/6 ❌</span>`
        : `<span style="color:${it.dayInBlock>=6?'#856404':'#2c5f8a'};font-weight:600;">${it.dayInBlock}/6</span>`;
    }
    const key = curMonth+'#'+i;
    const open = e.ausnahme || lzEdit[key];
    const mainRow = `<tr>
      <td><input class="t" style="width:64px" value="${esc(e.datum)}" placeholder="TT.MM." onchange="updLz(${i},'datum',this.value)"></td>
      <td><input class="w-full" value="${esc(e.strecke)}" placeholder="von → nach" onchange="updLz(${i},'strecke',this.value)"></td>
      <td><input class="t" value="${esc(e.start)}" placeholder="15:00" onchange="updLz(${i},'start',this.value)"></td>
      <td><input class="t" value="${esc(e.ende)}" placeholder="18:30" onchange="updLz(${i},'ende',this.value)"></td>
      <td><input class="t" value="${esc(e.pause)}" placeholder="0:45" onchange="updLz(${i},'pause',this.value)"></td>
      <td class="computed">${c.drive==null?'–':fDur(c.drive)}</td>
      <td style="text-align:center;">${blk}</td>
      <td style="text-align:center;">${icon}</td>
      <td style="white-space:nowrap;"><button class="btn small ${e.ausnahme?'gold':'ghost'}" title="Ausnahme / Art. 12 dokumentieren" onclick="toggleLzEdit(${i})">⚖</button> <button class="btn small red" onclick="delLz(${i})">✕</button></td>
    </tr>`;
    if (!open) return mainRow;
    const sel = `<select onchange="updLz(${i},'ausnahmeArt',this.value)"><option value="">– Rechtsgrundlage wählen –</option>${AUSN.map(a=>`<option value="${a.v}" ${e.ausnahmeArt===a.v?'selected':''}>${esc(a.l)}</option>`).join('')}</select>`;
    const detail = `<tr class="ausn-row"><td colspan="9" style="background:#fffbea;">
      <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;">
        <label style="font-weight:700;"><input type="checkbox" ${e.ausnahme?'checked':''} onchange="updLz(${i},'ausnahme',this.checked)"> Ausnahme geltend gemacht</label>
        <label>Überschreitung <input class="t" style="width:60px" value="${esc(e.ueberMin||'')}" placeholder="${c.over?fDur(c.over):'0:15'}" onchange="updLz(${i},'ueberMin',this.value)"></label>
        <label style="font-weight:700;color:#7a0000;"><input type="checkbox" ${e.vermerkAusdruck?'checked':''} onchange="updLz(${i},'vermerkAusdruck',this.checked)"> Vermerk auf Tachograph-Ausdruck erfolgt</label>
      </div>
      <div style="margin-top:8px;">${sel}</div>
      <div style="margin-top:8px;display:flex;gap:8px;align-items:flex-start;">
        <textarea rows="3" placeholder="Begründung – bei Art. 12 muss der Grund zusätzlich handschriftlich auf den Tacho-Ausdruck!" onchange="updLz(${i},'ausnahmeGrund',this.value)" style="font-family:inherit;font-size:0.84rem;padding:6px;">${esc(e.ausnahmeGrund||'')}</textarea>
        <button class="btn small ghost" onclick="fillAusnGrund(${i})" title="Art.-12-Textbaustein einfügen">📋 Baustein</button>
      </div>
      ${e.ausnahme && !e.vermerkAusdruck ? '<div style="margin-top:6px;color:#7a0000;font-size:0.8rem;font-weight:700;">📝❗ Bei Art. 12 ist der handschriftliche Vermerk auf dem Tachograph-Ausdruck rechtlich zwingend – spätestens bei Ankunft am Halteplatz.</div>' : ''}
    </td></tr>`;
    return mainRow + detail;
  }).join('');

  // Wochenruhe-Blöcke (6-Tage-Regel)
  const blkRows = blocks.map(b => {
    const span = b.end ? Math.round((b.end - b.start)/60000) : 0;
    const days = b.lastDay || 1;
    let status;
    if (b.anyViol) status = '<span style="color:#c0392b;font-weight:700;">❌ 6-Tage-Regel überschritten</span>';
    else if (b.closedBy != null) status = b.closedBy >= LZ.WK_REST_REG
      ? '<span style="color:#155724;">✓ reguläre Wochenruhe ('+fDur(b.closedBy)+')</span>'
      : '<span style="color:#856404;">⚠️ reduzierte Wochenruhe ('+fDur(b.closedBy)+') – Ausgleich nötig</span>';
    else status = days>=6
      ? '<span style="color:#856404;font-weight:700;">⏳ offen – Wochenruhe jetzt fällig</span>'
      : '<span style="color:#2c5f8a;">⏳ offen – Tag '+days+'/6</span>';
    return `<tr><td>${fDate(b.start)}${b.end?'–'+fDate(b.end):''}</td><td style="text-align:center;">${days}</td><td style="text-align:right;">${fDur(span)}</td><td>${status}</td></tr>`;
  }).join('');

  // Ausgleichs-Schuld aus reduzierten Wochenruhen
  let debt = 0; blocks.forEach(b => { if (b.closedBy != null && b.closedBy < LZ.WK_REST_REG) debt += (LZ.WK_REST_REG - b.closedBy); });

  const wkRows = weeks.map(w => {
    const wend = new Date(w.monday.getTime() + 6*86400000);
    const weekFlag = w.drive > LZ.WEEK_MAX
      ? '<span title="Wochenlenkzeit > 56:00 h (Art. 6 Abs. 2)">❌</span>'
      : (w.tenH > 2 ? '<span title="mehr als 2× verlängerte Tageslenkzeit in der Woche (Art. 6 Abs. 1)">⚠️</span>' : '<span style="color:#28a745;">✓</span>');
    const biFlag = w.biweek > LZ.BIWEEK_MAX ? ' <span title="2-Wochen-Lenkzeit > 90:00 h (Art. 6 Abs. 3)">❌</span>' : '';
    return `<tr>
      <td>KW ${fDate(w.monday)}–${fDate(wend)}</td>
      <td style="text-align:right;font-weight:700;color:#2c5f8a;">${fDur(w.drive)}</td>
      <td style="text-align:center;">${w.tenH}</td>
      <td style="text-align:right;">${fDur(w.biweek)}${biFlag}</td>
      <td style="text-align:center;">${weekFlag}</td>
    </tr>`;
  }).join('');

  const restWarn = all.filter(it => it.restBefore != null && it.restBefore < LZ.REST_REG).map(it => {
    const sev = it.restBefore < LZ.REST_RED ? '❌' : '⚠️';
    const txt = it.restBefore < LZ.REST_RED
      ? '(< 9:00 h – unzulässig, Art. 8 Abs. 2)'
      : '(reduziert 9–11 h – max. 3× zwischen zwei Wochenruhezeiten, Art. 8 Abs. 4)';
    return `<li>${sev} ${String(it.day).padStart(2,'0')}.${String(it.num).padStart(2,'0')}.: Tagesruhe davor nur ${fDur(it.restBefore)} ${txt}</li>`;
  }).join('');

  return `${kpis}
  ${gBanner}
  <div class="hint">⚖ <b>EU-Lenk- und Ruhezeiten (VO (EG) 561/2006):</b> Tageslenkzeit max. <b>9:00 h</b> (2×/Woche 10:00 h) · nach <b>4:30 h</b> Pflichtpause <b>45 min</b> · Woche (Mo–So) max. <b>56:00 h</b> · zwei Wochen max. <b>90:00 h</b> · Tagesruhe min. <b>11:00 h</b> (red. 9 h, max. 3×) · nach <b>6×24 h</b> Pflicht-Wochenruhe (45 h, red. 24 h). <b>Lenkzeit = Ende − Start − Pause.</b></div>
  <div class="toolbar"><button class="btn green" onclick="addLz()">+ Fahrt / Lenktag hinzufügen</button><span style="font-size:0.78rem;color:#666;">⚖ = Ausnahme/Art. 12 dokumentieren</span></div>
  <div class="table-scroll"><table class="grid xwide">
    <thead><tr><th style="width:74px">Datum</th><th>Strecke (von → nach)</th><th style="width:66px">Start</th><th style="width:66px">Ende</th><th style="width:66px">Pause</th><th style="width:78px">Lenkzeit</th><th style="width:56px" title="6-Tage-Regel">6-Tage</th><th style="width:62px">Regel</th><th style="width:88px"></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="9" style="color:#999;font-style:italic;padding:14px;">Noch keine Lenkzeiten für '+meta.name+' erfasst.</td></tr>'}</tbody>
  </table></div>
  <div class="panel" style="margin-top:16px;">
    <h3>🛌 Wochenruhe-Blöcke (6-Tage-Regel, alle Monate)</h3>
    <div class="table-scroll"><table class="grid">
      <thead><tr><th>Block (Zeitraum)</th><th style="text-align:center;">Fahrtage</th><th style="text-align:right;">Spanne</th><th>Status</th></tr></thead>
      <tbody>${blkRows || '<tr><td colspan="4" style="color:#999;font-style:italic;padding:14px;">Noch keine Fahrten erfasst.</td></tr>'}</tbody>
    </table></div>
  </div>
  ${debt>0 ? `<div class="hint" style="border-left-color:#856404;"><b>Ausgleichs-Schuld (reduzierte Wochenruhen):</b> ${fDur(debt)} müssen als zusammenhängende Ruhe vor Ende der dritten Folgewoche nachgeholt werden (Art. 8 Abs. 6).</div>` : ''}
  <div class="panel" style="margin-top:16px;">
    <h3>📅 Wochen-Lenkzeiten (alle Monate, Mo–So)</h3>
    <div class="table-scroll"><table class="grid">
      <thead><tr><th>Kalenderwoche</th><th style="text-align:right;">Lenkzeit Woche</th><th style="text-align:center;">10 h-Tage</th><th style="text-align:right;">Σ 2 Wochen</th><th style="text-align:center;">Status</th></tr></thead>
      <tbody>${wkRows || '<tr><td colspan="5" style="color:#999;font-style:italic;padding:14px;">Noch keine Fahrten erfasst.</td></tr>'}</tbody>
    </table></div>
  </div>
  ${restWarn ? `<div class="hint" style="border-left-color:#c0392b;background:#fdecea;color:#7a0000;"><b>Tagesruhe-Hinweise:</b><ul style="margin:6px 0 0 18px;">${restWarn}</ul></div>` : ''}
  <div class="hint blue" style="font-size:0.74rem;">Unterstützungs-Tool zur Eigenübersicht – ersetzt nicht den digitalen Fahrtenschreiber / die Fahrerkarte (VO (EU) 165/2014). <b>Ausnahmen nach Art. 12 erfordern den handschriftlichen Vermerk auf dem Tacho-Ausdruck</b> (spätestens bei Ankunft) – dieses Tool dokumentiert sie nur ergänzend. Die Pausen-Prüfung wertet nur die Gesamtpause je Tag, nicht deren Lage (15+30). Maßgeblich bleiben die Tacho-Aufzeichnungen.</div>`;
}

/* ════════════════════════ MAIN RENDER ════════════════════════ */
function render() {
  if (!state) return;
  renderNav();
  const main = document.getElementById('main');
  switch(curSub) {
    case 'zeit': main.innerHTML = renderZeit(); break;
    case 'lenkzeiten': main.innerHTML = renderLenkzeiten(); break;
    case 'reiseplan': main.innerHTML = renderReiseplan(); break;
    case 'auslagen': main.innerHTML = renderAuslagen(); break;
    case 'abrechnung': main.innerHTML = renderAbrechnung(); break;
    case 'export': main.innerHTML = renderExport(); break;
    case 'einstellungen': main.innerHTML = renderEinstellungen(); break;
  }
}

/* ════════════════════════ START ════════════════════════ */
if (syncCfg && syncCfg.token) loadRemote();
else showLogin();
</script>
</body>
